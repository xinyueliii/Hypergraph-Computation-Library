name: hypercomp-core
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.0+cu126
      - scipy>=1.8
      - optuna
      - numpy
      - scikit-learn
      - requests
      - matplotlib>=3.7.0
      - pytest
      - -e .
