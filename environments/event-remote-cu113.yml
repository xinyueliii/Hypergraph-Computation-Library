# Validated E-HRSAI/E-3DTrack compatibility runtime on AutoDL RTX 3090.
# System CUDA 11.3 and GCC 9 are supplied by the server image.
name: hypercomp-event-remote
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - pytorch=1.10.0
  - torchvision=0.11.1
  - cudatoolkit=11.3
  - numpy=1.21.4
  - scipy=1.10.1
  - pyyaml=6.0.1
  - pip:
      - opencv-python-headless==4.8.1.78
      - Pillow==10.4.0
      - prefetch-generator==1.0.1
      - einops==0.4.1
      - kornia==0.6.7
      - tqdm==4.64.0
      - imageio==2.35.1
      - pymeshlab==2021.10
      - rich==13.9.4

